name: Android Build & Test CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test Hameed Collection Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Environment Files
        run: |
          if [ -f .env.example ]; then cp .env.example .env; fi

      - name: Generate Gradle Wrapper and Set Permissions
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Set up Node.js (for Firebase Rules Unit Tests)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: npm ci || npm install
        continue-on-error: true

      - name: Run Firebase Firestore Security Rules Tests
        run: npm test
        env:
          GCP_PROJECT: demo-no-project
        continue-on-error: true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HameedCollection-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          
